<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ECE8DF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Floripa Velo - O app do ciclista em Florianópolis: vento em tempo real, rotas seguras e evolução para iniciantes.">
  <title>Floripa Velo · Ciclismo para Iniciantes em Florianópolis</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Estilos Modulares -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Telas / Abas Principais -->
  <section class="view" id="v-hoje"></section>
  <section class="view" id="v-semana" hidden></section>
  <section class="view" id="v-plano" hidden></section>
  <section class="view" id="v-mais" hidden></section>

  <!-- Tela de Onboarding (Boas-Vindas) -->
  <section class="onb" id="onb" hidden></section>

  <!-- Barra de Navegação Inferior -->
  <nav>
    <button data-a="hoje" class="on">Hoje</button>
    <button data-a="semana">Semana</button>
    <button data-a="plano">Plano</button>
    <button data-a="mais">Mais</button>
  </nav>

  <!-- Scripts da Aplicação (Estrutura Modular & Organizada) -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/api/weather.js"></script>
  <script src="js/api/routing.js"></script>
  <script src="js/services/training.js"></script>
  <script src="js/services/calendar.js"></script>
  <script src="js/views/todayView.js"></script>
  <script src="js/views/weekView.js"></script>
  <script src="js/views/planView.js"></script>
  <script src="js/views/moreView.js"></script>
  <script src="js/views/onboardingView.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
